name: LitNexus Weekly Literature Radar

on:
  schedule:
    # Run automatically every Monday at 02:00 UTC (11:00 JST)
    - cron: '0 2 * * 1'
  workflow_dispatch:
    # Allows manual triggering from GitHub UI

permissions:
  contents: write
  pull-requests: write

jobs:
  harvest-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Harvest Recent Literature for Configured Domains
        run: |
          for domain_path in domains/*; do
            if [ -d "$domain_path" ]; then
              echo ">>> Scanning domain: $domain_path"
              python tools/fetch_arxiv.py --domain "$domain_path" --max-results 30
            fi
          done

      - name: Validate Integrity of Indices
        run: |
          python tools/validate_domain.py --all

      - name: Commit and Push Updates
        run: |
          git config --global user.name "LitNexus-Radar[bot]"
          git config --global user.email "litnexus-radar@users.noreply.github.com"
          git add domains/
          if git diff --staged --quiet; then
            echo "No new literature discovered this cycle."
          else
            git commit -m "chore(radar): automated literature ingestion [skip ci]"
            git push origin main
          fi
